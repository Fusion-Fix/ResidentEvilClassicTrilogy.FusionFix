[MAIN]
; RE1 HD Remaster keyboard / XInput Type A bindings in both movement modes.
; Includes quick turn (Q / R3) and reload while aiming (R / B). 0 restores native bindings.
HDControls = 1
; Mouse turning while standing, walking or running; high/level/low aim while aiming.
; Mouse turning supplements keyboard, stick and D-pad movement, including running.
; Available in Controls; paused in menus, movies and scripted sequences.
MouseSteering = 0
; Mouse steering sensitivity: 0.25 to 4.0 (default 1.0).
MouseSensitivity = 1.0
; Go straight to the main menu, skipping warnings, logos and the opening movie.
SkipIntro = 1
; Skip door animations while retaining room loading.
SkipDoor = 1
; Skip the recap captions after loading a save. Story subtitles remain intact.
FastLoad = 0
; Automatically load a save on startup.
AutoLoad = 0
; 0 = latest dated save, 1-15 = memory card 1, 16-30 = memory card 2.
; If old saves have no reliable timestamps, Latest opens the native slot picker.
LoadSlot = 0
; Remove polygon wobble by preserving subpixel model coordinates.
; F2 toggles this setting for the current session.
WobbleFix = 1
; Player-follow pan-and-scan uses the output aspect, capped by MaxAspectRatio.
; Menus and text retain their complete 4:3 layout.
; F3 toggles widescreen / 4:3. Right stick and mouse wheel adjust vertical framing.
; Mouse wheel: look up/down; smoothly releases when player-follow panning resumes.
PanAndScan = 0
; Display menu aspect limit. Accepts ratios (16:9, 21:9) or decimals (1.777778).
MaxAspectRatio = 16:9
; Screen-relative keyboard / left-stick movement; D-pad retains tank controls.
; F4 toggles alternate controls for the current session.
; Aiming, menus, scripted movement and attract demos retain native controls.
AlternateControls = 0
; Alternate controls: running into a pushable object starts pushing at native speed.
; 0 retains the original requirement to walk into the object.
AutoPush = 1
; Alternate controls: partial left-stick tilt walks, full tilt runs.
; Alternate keyboard controls: 0 = Walk, 1 = Run.
DefaultPace = 0
; Shift changes to the opposite pace: 0 = Hold, 1 = Toggle.
ShiftBehavior = 0
