name: Bug, crash or freeze/hang
description: Choose this if something doesn't work and no other template applies.
body:
  - type: textarea
    id: reproduction
    validations:
      required: true
    attributes:
      label: How to reproduce
      placeholder: |
        Steps to reproduce the problem.

        Here's a screenshot or video:
        [upload files]
      description: >
        Try to explain so someone else could do the same thing. Upload savedata or captures if possible.

  - type: textarea
    id: desired
    validations:
      required: true
    attributes:
      label: What should happen
      placeholder: |
        It should not crash.
      description: >
        If it's a crash, just say "It shouldn't crash." For more complex bugs, explain what the expected behavior is.

  - type: textarea
    id: logs
    attributes:
      label: CrashDumps and logs
      placeholder: '[drag files here...]'
      description: |
        If the ASI loader generates crash minidumps or logs, please include them here.

  - type: input
    id: workingversion
    attributes:
      label: Last working version
      placeholder: v1.0
      description: >
        If it worked before, it's usually easier to narrow down a fix.

  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: "Test in the [latest build](https://github.com/Fusion-Fix/ResidentEvilClassicTrilogy.FusionFix/actions) in case it's already fixed."
          required: true
        - label: "[Search for other reports](https://github.com/Fusion-Fix/ResidentEvilClassicTrilogy.FusionFix/issues) of the same issue."
          required: true
        - label: "Include logs or screenshots of the issue."
          required: true
