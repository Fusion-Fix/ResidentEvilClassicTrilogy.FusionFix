; Resident Evil Classic Fusion Fix.
[MAIN]
; RE1 HD Remaster keyboard / XInput Type A bindings in both movement modes.
; Includes quick turn (Q / R3) and reload while aiming (R / B). 0 restores native bindings.
HDControls = 1
; Store native game settings beside the executable instead of in the registry.
PortableMode = 1
; Go straight to the main menu, skipping warnings, logos and the opening movie.
SkipIntro = 1
; Skip door animations while retaining room loading.
SkipDoor = 1
; Skip the recap captions after loading a save. Story subtitles remain intact.
FastLoad = 0
; Automatically load a save on startup.
AutoLoad = 0
; 0 = latest save by file modification time, 1-8 = native save slot.
; Missing or unreadable saves retain the native slot picker.
LoadSlot = 0
; Player-follow pan-and-scan uses the output aspect, capped by MaxAspectRatio.
; Menus and text retain their complete 4:3 layout.
PanAndScan = 0
; Advanced, INI-only limit. Accepts ratios (16:9, 21:9) or decimals (1.777778).
MaxAspectRatio = 16:9
; Screen-relative keyboard / left-stick movement; D-pad retains tank controls.
; Aiming, menus, scripted movement and attract demos retain native controls.
AlternateControls = 0
; Alternate controls: partial left-stick tilt walks, full tilt runs.
; Keyboard Shift behavior (alternate controls only):
; 0 = Walk by default, hold Shift to run.
; 1 = Walk by default, press Shift to toggle running.
; 2 = Run by default, hold Shift to walk.
; 3 = Run by default, press Shift to toggle walking.
KeyboardRunMode = 0
